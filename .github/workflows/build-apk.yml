name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "=== Fichiers à la racine ==="
          ls -la

          # Cherche le premier .zip présent
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Aucun fichier .zip trouvé à la racine du repo"
            exit 1
          fi
          echo "ZIP trouvé : $ZIP"

          # Décompresse à la racine
          unzip -o -q "$ZIP" -d extracted

          # Si le zip contient un sous-dossier, on le remonte
          if [ -f extracted/settings.gradle.kts ] || [ -f extracted/settings.gradle ]; then
            echo "Projet directement dans le zip"
            cp -a extracted/. .
          else
            SUB=$(find extracted -maxdepth 2 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
            if [ -n "$SUB" ]; then
              DIR=$(dirname "$SUB")
              echo "Projet dans sous-dossier : $DIR"
              cp -a "$DIR"/. .
            else
              echo "::error::Pas de settings.gradle.kts dans le zip"
              find extracted -maxdepth 3 -type f | head -40
              exit 1
            fi
          fi

          rm -rf extracted
          echo "=== Après unzip ==="
          ls -la
          test -f settings.gradle.kts && echo "settings.gradle.kts OK"
          test -f gradlew && echo "gradlew OK" || echo "gradlew absent (sera généré)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beststreamand-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
