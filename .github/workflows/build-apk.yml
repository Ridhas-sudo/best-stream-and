      - name: Build Release APK
        run: |
          FILE=$(find . -name "ChannelListScreen.kt" | head -n 1)
          # On force V1+V2 dans le build.gradle
          sed -i 's/v1SigningEnabled false/v1SigningEnabled true/g' app/build.gradle.kts
          sed -i 's/isV1SigningEnabled = false/isV1SigningEnabled = true/g' app/build.gradle.kts
          ./gradlew assembleRelease --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          tag_name: build-${{ github.run_number }}
