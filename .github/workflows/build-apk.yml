name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
            - uses: actions/checkout@v4

            - name: Unzip project
        run: |
          ls -la
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "Pas de zip"; exit 1; fi
          unzip -o -q "$ZIP" -d extracted
          if [ -f extracted/settings.gradle.kts ]; then
            cp -a extracted/. .
          else
            SUB=$(find extracted -maxdepth 2 -name "settings.gradle.kts" | head -n 1)
            DIR=$(dirname "$SUB")
            cp -a "$DIR"/. .
          fi
          rm -rf extracted
          ls -la

            - name: Fix experimental API error
        run: |
          FILE=$(find . -name "ChannelListScreen.kt" | head -n 1)
          echo "Patch $FILE"
          if ! grep -q "ExperimentalMaterial3Api" "$FILE"; then
            sed -i '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' "$FILE"
          fi

            - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

            - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

            - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

            - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: build-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
