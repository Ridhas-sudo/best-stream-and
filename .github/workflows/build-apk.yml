name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unzip and Build
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "ZIP=$ZIP"
          unzip -o -q "$ZIP" -d extracted
          PROJ=$(find extracted -name "settings.gradle.kts" | head -n 1)
          DIR=$(dirname "$PROJ")
          cp -a "$DIR"/. .
          rm -rf extracted
          FILE=$(find . -name "ChannelListScreen.kt" | head -n 1)
          if [ -f "$FILE" ]; then
            sed -i '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' "$FILE"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: build-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
